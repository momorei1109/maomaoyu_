<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="https://i.postimg.cc/02M9GT4s/IMG-4705.jpg">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://i.postimg.cc/9XxpsWyY/IMG-4419.png">
    <title>My perspective on life(･∞･ﾐэ )Э</title>
    
    <!-- 极简 Zev黑体 -->
    <link href="https://fontsapi.zeoseven.com/2110/main/result.css" onload="this.rel='stylesheet'" rel="preload" as="style" crossorigin />
    <noscript><link rel="stylesheet" href="https://fontsapi.zeoseven.com/2110/main/result.css" /></noscript>
    
    <style>
        /* ====== 高定黑白灰引擎 (空气感、低对比度) ====== */
        :root {
            --bg-main: #F7F8FA;        /* 偏白的干净底色 */
            --bg-panel: #FFFFFF;
            
            --text-title: #3A3A3C;     /* 稍微浅一点的黑灰色标题 */
            --text-main: #2C2C2E;
            --text-sub: #8E8E93;
            --text-mini: #C7C7CC;
            
            --border-line: rgba(0, 0, 0, 0.05); /* 极细极淡边框 */
            --border-dash: rgba(0, 0, 0, 0.1);
            
            --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.03), 0 1px 3px rgba(0, 0, 0, 0.02);
            --hover-bg: rgba(0, 0, 0, 0.02);
            --input-bg: #F2F2F7;
            --btn-bg: #FFFFFF;
            
            --accent-color: #111111;
            
            /* 极淡的波点 */
            --dot-bg: radial-gradient(rgba(0,0,0,0.045) 1px, transparent 1px);
        }

        body.dark-mode {
            --bg-main: #18181A;        /* 高级岩灰，拒绝死黑 */
            --bg-panel: #202022;
            
            --text-title: #D1D1D6;
            --text-main: #EAEAEA;
            --text-sub: #8E8E93;
            --text-mini: #555555;
            
            --border-line: rgba(255, 255, 255, 0.05);
            --border-dash: rgba(255, 255, 255, 0.12);
            
            --card-shadow: 0 8px 30px rgba(0, 0, 0, 0.25), 0 1px 3px rgba(0, 0, 0, 0.15);
            --hover-bg: rgba(255, 255, 255, 0.03);
            --input-bg: #151516;
            --btn-bg: #2C2C2E;
            
            --accent-color: #EAEAEA;
            
            --dot-bg: radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px);
        }

        body.force-light { --bg-main:#F7F8FA; --bg-panel:#FFFFFF; --text-title:#3A3A3C; --text-main:#2C2C2E; --text-sub:#8E8E93; --border-line:rgba(0,0,0,0.05); --input-bg:#F2F2F7; --btn-bg:#FFFFFF; --dot-bg:radial-gradient(rgba(0,0,0,0.025) 1px, transparent 1px); }
        body.force-dark { --bg-main:#18181A; --bg-panel:#202022; --text-title:#D1D1D6; --text-main:#EAEAEA; --text-sub:#8E8E93; --border-line:rgba(255,255,255,0.05); --input-bg:#151516; --btn-bg:#2C2C2E; --dot-bg:radial-gradient(rgba(255,255,255,0.02) 1px, transparent 1px); }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

        body {
            font-family: "ZevHeiTC-N Dev", -apple-system, sans-serif;
            background-color: var(--bg-main); color: var(--text-main);
            background-image: var(--dot-bg); background-size: 16px 16px;
            font-size: 12px; transition: background-color 0.3s, color 0.3s;
        }

        /* ====== 顶部导航 ====== */
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 20px; background: rgba(var(--bg-panel), 0.7);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border-bottom: 1px solid var(--border-line);
            position: sticky; top: 0; z-index: 100;
        }
        
        .nav-left { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .status-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background-color: var(--text-sub); 
            animation: breath 3s infinite ease-in-out;
        }
        @keyframes breath { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.85); } }
        
        .nav-title { font-size: 13px; font-weight: bold; color: var(--text-title); letter-spacing: 0.5px; }
        
        .nav-tools { display: flex; gap: 8px; }
        
        /* 胶囊状设置/模式按钮 */
        .icon-btn { 
            cursor: pointer; font-size: 12px; color: var(--text-sub); 
            transition: all 0.2s; font-family: monospace; 
            display: flex; align-items: center; justify-content: center;
            padding: 4px 12px; border-radius: 14px;
            background: var(--btn-bg); border: 1px solid var(--border-line);
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }
        .icon-btn:hover { color: var(--text-main); background: var(--hover-bg); }

        /* ====== 视图容器 ====== */
        .view-container { 
            display: none; padding: 20px 16px; max-width: 440px; margin: 0 auto; 
            animation: fadeIn 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); 
        }
        .view-container.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        /* ====== 胶囊按钮 (全局) ====== */
        .capsule-btn {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 6px 14px; border-radius: 20px;
            font-size: 11px; font-weight: bold; letter-spacing: 1px;
            cursor: pointer; transition: all 0.2s ease;
            background: var(--bg-panel); border: 1px solid var(--border-line);
            color: var(--text-sub);
        }
        .capsule-btn:active { transform: scale(0.96); }
        .capsule-btn:hover { color: var(--text-main); }
        .capsule-btn.primary { background: var(--text-title); color: var(--bg-main); border-color: transparent; }

        /* ====== 主页：新增按钮与网格 ====== */
        .add-block {
            background: var(--hover-bg); border: 1px dashed var(--border-dash);
            border-radius: 12px; padding: 12px; margin-bottom: 20px;
            display: flex; justify-content: center; align-items: center; gap: 8px;
            cursor: pointer; transition: all 0.2s ease;
        }
        .add-block:active { transform: scale(0.98); background: var(--border-line); }
        .add-text { font-size: 11px; color: var(--text-sub); letter-spacing: 1px; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 14px; }
        .card {
            background: var(--bg-panel); border: 1px solid var(--border-line);
            border-radius: 10px; overflow: hidden; cursor: pointer;
            box-shadow: var(--card-shadow); transition: transform 0.2s;
            display: flex; flex-direction: column;
        }
        .card:active { transform: scale(0.96); }
        .card-cover { width: 100%; aspect-ratio: 4/3; background-size: cover; background-position: center; border-bottom: 1px solid var(--border-line); background-color: var(--input-bg);}
        .card-info { padding: 10px; flex-grow: 1; display: flex; flex-direction: column; justify-content: center;}
        .card-title { font-size: 12px; font-weight: bold; color: var(--text-title); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .empty-state { text-align: center; color: var(--text-sub); padding: 30px 0; font-family: monospace; grid-column: 1 / -1; }

        /* ====== 编辑/新增页 ====== */
        .form-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .form-title { font-size: 14px; font-weight: bold; color: var(--text-title); }
        
        .form-group { margin-bottom: 16px; position: relative;}
        .form-label { display: flex; justify-content: space-between; align-items: center; font-size: 10px; font-weight: bold; color: var(--text-sub); margin-bottom: 6px; letter-spacing: 0.5px;}
        .form-input, .form-textarea {
            width: 100%; background: var(--input-bg); color: var(--text-main);
            border: 1px solid var(--border-line); border-radius: 8px;
            padding: 10px 12px; font-size: 11px; font-family: inherit; outline: none;
            transition: border-color 0.2s;
        }
        .form-input:focus, .form-textarea:focus { border-color: var(--text-sub); }
        .form-textarea { height: 100px; resize: vertical; line-height: 1.5; }
        .code-area { font-family: monospace; height: 160px; font-size: 10.5px; }

        /* 图片直传 */
        .upload-area {
            width: 100%; height: 100px;
            background: var(--input-bg); border: 1px dashed var(--border-dash);
            border-radius: 8px; display: flex; justify-content: center; align-items: center;
            cursor: pointer; overflow: hidden; position: relative; transition: border-color 0.2s;
        }
        .upload-area:hover { border-color: var(--text-sub); }
        .upload-text { font-size: 11px; color: var(--text-sub); pointer-events: none; }
        .upload-preview-wrap { position: absolute; inset: 0; display: none; }
        .upload-preview { width: 100%; height: 100%; object-fit: cover; display: block; }

        /* 呼叫AI */
        .ai-btn {
            background: var(--bg-panel); color: var(--text-main); border: 1px solid var(--border-line);
            padding: 2px 10px; border-radius: 12px; font-size: 9px; cursor: pointer;
            transition: all 0.2s; display: flex; align-items: center; box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }
        .ai-btn:active { transform: scale(0.95); background: var(--hover-bg); }

        /* ====== 详情/预览页 ====== */
        .detail-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .d-title { font-size: 14px; font-weight: bold; color: var(--text-title); line-height: 1.4; word-break: break-all;}
        
        .view-switch {
            display: flex; background: var(--input-bg); border-radius: 20px; padding: 2px;
            margin-bottom: 16px; border: 1px solid var(--border-line);
        }
        .sw-btn {
            flex: 1; text-align: center; padding: 6px 0; font-size: 10px; font-weight: bold;
            color: var(--text-sub); border-radius: 18px; cursor: pointer; transition: all 0.2s;
        }
        .sw-btn.active { background: var(--bg-panel); color: var(--text-main); box-shadow: 0 2px 6px rgba(0,0,0,0.04); }

        /* 沙箱预览 */
        .render-box {
            width: 100%; height: 600px;
            border: 1px solid var(--border-line); border-radius: 12px;
            overflow: hidden; margin-bottom: 24px; background: var(--bg-panel);
            box-shadow: var(--card-shadow); transition: all 0.3s;
        }
        .render-box iframe { width: 100%; height: 100%; border: none; display: block; }
        
        .copy-block {
            background: var(--bg-panel); border: 1px solid var(--border-line);
            border-radius: 10px; padding: 12px; margin-bottom: 14px;
        }
        .cb-head { display: flex; justify-content: space-between; margin-bottom: 8px; align-items: center;}
        .cb-title { font-size: 10px; font-weight: bold; color: var(--text-sub); font-family: monospace; }
        .cb-content {
            font-family: monospace; font-size: 10px; color: var(--text-main);
            background: var(--input-bg); padding: 8px 10px; border-radius: 6px;
            max-height: 100px; overflow-y: auto; white-space: pre-wrap; word-break: break-all;
            border: 1px solid var(--border-line); line-height: 1.4;
        }

        /* ====== 设置弹窗 ====== */
        .modal-bg {
            position: fixed; inset: 0; background: rgba(0,0,0,0.3); backdrop-filter: blur(5px);
            z-index: 900; display: none; align-items: center; justify-content: center;
            animation: fadeIn 0.2s;
        }
        .modal-bg.active { display: flex; }
        .modal-card {
            background: var(--bg-panel); width: 85%; max-width: 320px;
            border-radius: 16px; padding: 20px; border: 1px solid var(--border-line);
            box-shadow: var(--card-shadow);
        }
        .modal-title { font-size: 13px; font-weight: bold; color: var(--text-title); margin-bottom: 12px; text-align: center;}
        .modal-hint { font-size: 10px; color: var(--text-sub); margin-bottom: 16px; line-height: 1.4; text-align: justify;}
        
        .dropdown {
            position: absolute; top: calc(100% + 4px); left: 0; right: 0;
            background: var(--bg-panel); border: 1px solid var(--border-line);
            border-radius: 8px; max-height: 160px; overflow-y: auto; z-index: 1000;
            box-shadow: var(--card-shadow); display: none;
        }
        .dropdown-item {
            padding: 8px 12px; font-size: 11px; color: var(--text-main);
            cursor: pointer; border-bottom: 1px solid var(--border-line);
        }
        .dropdown-item:hover { background: var(--hover-bg); }

        .toast {
            position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-10px);
            background: var(--text-main); color: var(--bg-main);
            padding: 8px 18px; border-radius: 20px; font-size: 10.5px; font-weight: bold; letter-spacing: 1px;
            opacity: 0; pointer-events: none; transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="nav-left" onclick="app.goHome()">
            <div class="status-dot"></div>
            <div class="nav-title">My perspective on life(･∞･ﾐэ )Э</div>
        </div>
        <div class="nav-tools">
            <div class="icon-btn" onclick="app.openSettings()">⚙</div>
            <div class="icon-btn" onclick="app.toggleTheme()">☾</div>
        </div>
    </div>

    <!-- 主页 -->
    <div id="view-home" class="view-container active">
        <div class="add-block" onclick="app.goEdit()">
            <span class="add-text">+ 新增小卡片</span>
        </div>
        <div class="grid" id="card-list"></div>
    </div>

    <!-- 预览页 -->
    <div id="view-detail" class="view-container">
        <div class="detail-header">
            <div class="capsule-btn" onclick="app.goHome()">返回</div>
            <div class="detail-actions" style="display:flex; gap:8px;">
                <div class="capsule-btn danger" onclick="app.deleteItem(app.currentId)">删除</div>
                <div class="capsule-btn primary" onclick="app.goEdit(app.currentId)">编辑</div>
            </div>
        </div>
        
        <div class="d-title" id="d-title">标题</div>
        
        <div class="view-switch">
            <div class="sw-btn active" id="sw-raw" onclick="app.switchRenderMode('raw')">空框架</div>
            <div class="sw-btn" id="sw-data" onclick="app.switchRenderMode('data')">注入文本</div>
        </div>

        <div class="render-box">
            <iframe id="d-iframe" sandbox="allow-scripts allow-same-origin"></iframe>
        </div>

        <div class="copy-block">
            <div class="cb-head">
                <span class="cb-title">正则匹配词</span>
                <div class="capsule-btn" onclick="app.copyText('d-regex', this)">复制</div>
            </div>
            <div class="cb-content" id="d-regex"></div>
        </div>

        <div class="copy-block">
            <div class="cb-head">
                <span class="cb-title">酒馆输出规范</span>
                <div class="capsule-btn" onclick="app.copyText('d-prompt', this)">复制</div>
            </div>
            <div class="cb-content" id="d-prompt"></div>
        </div>
    </div>

    <!-- 表单页 -->
    <div id="view-form" class="view-container">
        <div class="form-header">
            <div class="capsule-btn" onclick="app.goHome()">取消</div>
            <div class="form-title" id="f-header-title">编辑属性</div>
            <div class="capsule-btn primary" onclick="app.saveItem()">保存</div>
        </div>
        
        <input type="hidden" id="f-id">
        
        <div class="form-group">
            <label class="form-label">小卡片名称</label>
            <input type="text" class="form-input" id="f-title" placeholder="给它起个名字...">
        </div>

        <div class="form-group">
            <label class="form-label">封面图片</label>
            <div class="upload-area" onclick="document.getElementById('f-cover-file').click()">
                <span class="upload-text" id="upload-text">+ 点击上传本地图片</span>
                <div class="upload-preview-wrap" id="f-cover-preview-wrap">
                    <img class="upload-preview" id="f-cover-preview" src="">
                </div>
            </div>
            <input type="file" id="f-cover-file" accept="image/*" style="display:none;" onchange="app.handleImageUpload(event)">
            <input type="hidden" id="f-cover-base64">
        </div>

        <div class="form-group">
            <label class="form-label">正则表达式</label>
            <input type="text" class="form-input" id="f-regex" placeholder="输入正则...">
        </div>
        <div class="form-group">
            <label class="form-label">输出规范 (Prompt)</label>
            <textarea class="form-textarea" id="f-prompt" placeholder="填入该美化对应的系统提示词..."></textarea>
        </div>
        
        <div class="form-group">
            <label class="form-label">
                测试文本
                <button class="ai-btn" onclick="app.generateTestText()">呼叫 AI 生成</button>
            </label>
            <textarea class="form-textarea" id="f-testtext" placeholder="用于 [注入文本] 模式预览的文本数据..."></textarea>
        </div>

        <div class="form-group">
            <label class="form-label">HTML 源码</label>
            <textarea class="form-textarea code-area" id="f-html" placeholder="将修改好的 HTML 粘贴在这里..."></textarea>
        </div>
    </div>

    <!-- API 设置 -->
    <div class="modal-bg" id="api-modal" onclick="if(event.target===this) app.closeSettings()">
        <div class="modal-card">
            <div class="modal-title">API 接口配置</div>
            <div class="modal-hint">配置您的 OpenAI 格式接口以启用 AI 文本生成。所有数据仅保存在手机本地。</div>
            <div class="form-group">
                <label class="form-label">Base URL</label>
                <input type="text" class="form-input" id="api-base" placeholder="https://api.openai.com/v1">
            </div>
            <div class="form-group">
                <label class="form-label">API Key</label>
                <input type="password" class="form-input" id="api-key" placeholder="sk-...">
            </div>
            <div class="form-group" style="position: relative;">
                <label class="form-label">
                    Model Name
                    <div class="capsule-btn" style="padding: 2px 6px; font-size: 9px;" onclick="app.fetchModels()">获取列表</div>
                </label>
                <input type="text" class="form-input" id="api-model" placeholder="手动输入或获取">
                <div class="dropdown" id="model-dropdown"></div>
            </div>
            <div style="display:flex; gap:10px; margin-top:20px;">
                <div class="capsule-btn" style="flex:1" onclick="app.closeSettings()">取消</div>
                <div class="capsule-btn primary" style="flex:1" onclick="app.saveSettings()">确认</div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">操作成功</div>

    <script>
        const app = {
            data: [],
            currentId: null,
            apiConfig: { url: '', key: '', model: '' },

            init() {
                this.loadData();
                this.loadSettings();
                this.initTheme();
                this.renderList();

                document.addEventListener('click', (e) => {
                    const dropdown = document.getElementById('model-dropdown');
                    if(dropdown && !e.target.closest('.form-group')) dropdown.style.display = 'none';
                });
            },

            loadData() {
                const stored = localStorage.getItem('UI_Archive_Data_v3');
                if (stored) { try { this.data = JSON.parse(stored); } catch (e) { this.data = []; } }
            },
            saveData() { localStorage.setItem('UI_Archive_Data_v3', JSON.stringify(this.data)); },

            loadSettings() {
                const stored = localStorage.getItem('UI_API_Config');
                if(stored) { try { this.apiConfig = JSON.parse(stored); } catch(e){} }
            },
            saveSettings() {
                this.apiConfig = {
                    url: document.getElementById('api-base').value.trim(),
                    key: document.getElementById('api-key').value.trim(),
                    model: document.getElementById('api-model').value.trim() || 'gpt-3.5-turbo'
                };
                localStorage.setItem('UI_API_Config', JSON.stringify(this.apiConfig));
                this.closeSettings();
                this.showToast('配置已保存');
            },

            openSettings() {
                document.getElementById('api-base').value = this.apiConfig.url;
                document.getElementById('api-key').value = this.apiConfig.key;
                document.getElementById('api-model').value = this.apiConfig.model;
                document.getElementById('api-modal').classList.add('active');
            },
            closeSettings() { document.getElementById('api-modal').classList.remove('active'); document.getElementById('model-dropdown').style.display = 'none'; },

            async fetchModels() {
                const baseUrl = document.getElementById('api-base').value.trim();
                const apiKey = document.getElementById('api-key').value.trim();
                if (!baseUrl || !apiKey) { this.showToast("请先填写 URL 和 Key"); return; }
                
                this.showToast("请求中...");
                try {
                    let endpoint = baseUrl.replace(/\/$/, '') + '/models';
                    const res = await fetch(endpoint, {
                        method: 'GET',
                        headers: { 'Authorization': 'Bearer ' + apiKey }
                    });
                    if (!res.ok) throw new Error("接口无响应");
                    
                    const resData = await res.json();
                    let models = [];
                    if (resData.data && Array.isArray(resData.data)) {
                        models = resData.data.map(m => m.id);
                    } else { throw new Error("格式不支持"); }
                    
                    const dropdown = document.getElementById('model-dropdown');
                    if (models.length === 0) {
                        dropdown.innerHTML = '<div class="dropdown-item">无可用模型</div>';
                    } else {
                        dropdown.innerHTML = models.map(m => `<div class="dropdown-item" onclick="app.selectModel('${m}')">${m}</div>`).join('');
                    }
                    dropdown.style.display = 'block';
                } catch (e) {
                    this.showToast("拉取失败：" + e.message);
                }
            },
            selectModel(model) {
                document.getElementById('api-model').value = model;
                document.getElementById('model-dropdown').style.display = 'none';
            },

            initTheme() {
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');
                const saved = localStorage.getItem('UI_Theme');
                const modeBtn = document.querySelector('.navbar .icon-btn:last-child');
                
                if (saved === 'dark') { document.body.classList.add('force-dark'); modeBtn.innerText = '☼'; }
                else if (saved === 'light') { document.body.classList.add('force-light'); modeBtn.innerText = '☾'; }
                else if (prefersDark.matches) { document.body.classList.add('force-dark'); modeBtn.innerText = '☼'; }
            },
            toggleTheme() {
                let isDark = document.body.classList.contains('force-dark') || (!document.body.classList.contains('force-light') && window.matchMedia('(prefers-color-scheme: dark)').matches);
                const modeBtn = document.querySelector('.navbar .icon-btn:last-child');
                if (isDark) {
                    document.body.classList.remove('force-dark'); document.body.classList.add('force-light');
                    localStorage.setItem('UI_Theme', 'light'); modeBtn.innerText = '☾';
                } else {
                    document.body.classList.remove('force-light'); document.body.classList.add('force-dark');
                    localStorage.setItem('UI_Theme', 'dark'); modeBtn.innerText = '☼';
                }
            },

            switchView(viewId) {
                document.querySelectorAll('.view-container').forEach(v => v.classList.remove('active'));
                document.getElementById(viewId).classList.add('active');
                window.scrollTo(0, 0);
            },
            goHome() { this.renderList(); this.switchView('view-home'); },

            renderList() {
                const list = document.getElementById('card-list');
                if (this.data.length === 0) { list.innerHTML = `<div class="empty-state">尚未收纳任何代码</div>`; return; }
                list.innerHTML = this.data.map(item => `
                    <div class="card" onclick="app.goDetail('${item.id}')">
                        <div class="card-cover" style="background-image: url('${item.cover || ''}')"></div>
                        <div class="card-info"><div class="card-title">${item.title || '未命名'}</div></div>
                    </div>
                `).join('');
            },

            handleImageUpload(event) {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 400; 
                        let width = img.width, height = img.height;
                        if (width > MAX_WIDTH) { height = Math.round((height * MAX_WIDTH) / width); width = MAX_WIDTH; }
                        canvas.width = width; canvas.height = height;
                        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                        const dataUrl = canvas.toDataURL('image/jpeg', 0.6); 
                        
                        document.getElementById('f-cover-base64').value = dataUrl;
                        document.getElementById('f-cover-preview').src = dataUrl;
                        document.getElementById('f-cover-preview-wrap').style.display = 'block';
                        document.getElementById('upload-text').style.display = 'none';
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            },

            goEdit(id = null) {
                document.getElementById('f-id').value = id || '';
                const previewWrap = document.getElementById('f-cover-preview-wrap');
                const uploadText = document.getElementById('upload-text');
                
                if (id) {
                    document.getElementById('f-header-title').innerText = '修改设定';
                    const item = this.data.find(d => d.id === id);
                    if(item) {
                        document.getElementById('f-title').value = item.title || '';
                        document.getElementById('f-cover-base64').value = item.cover || '';
                        document.getElementById('f-regex').value = item.regex || '';
                        document.getElementById('f-prompt').value = item.prompt || '';
                        document.getElementById('f-testtext').value = item.testText || '';
                        document.getElementById('f-html').value = item.htmlCode || '';
                        if(item.cover) { document.getElementById('f-cover-preview').src = item.cover; previewWrap.style.display = 'block'; uploadText.style.display = 'none'; } 
                        else { previewWrap.style.display = 'none'; uploadText.style.display = 'block'; }
                    }
                } else {
                    document.getElementById('f-header-title').innerText = '录入新美化';
                    document.getElementById('f-title').value = ''; document.getElementById('f-cover-base64').value = '';
                    document.getElementById('f-regex').value = ''; document.getElementById('f-prompt').value = '';
                    document.getElementById('f-testtext').value = ''; document.getElementById('f-html').value = '';
                    previewWrap.style.display = 'none'; uploadText.style.display = 'block';
                    document.getElementById('f-cover-file').value = '';
                }
                this.switchView('view-form');
            },

            saveItem() {
                const idVal = document.getElementById('f-id').value;
                const newItem = {
                    id: idVal ? idVal : 'ui_' + Date.now(),
                    title: document.getElementById('f-title').value.trim() || "未命名收纳",
                    cover: document.getElementById('f-cover-base64').value.trim(),
                    regex: document.getElementById('f-regex').value.trim(),
                    prompt: document.getElementById('f-prompt').value.trim(),
                    testText: document.getElementById('f-testtext').value.trim(),
                    htmlCode: document.getElementById('f-html').value.trim()
                };
                if (idVal) { const idx = this.data.findIndex(d => d.id === idVal); if (idx > -1) this.data[idx] = newItem; } 
                else { this.data.unshift(newItem); }
                try { this.saveData(); this.showToast('保存成功'); this.goHome(); } 
                catch(e) { alert("保存失败！图片可能超出了手机本地存储限制，请尝试更小的图。"); }
            },

            deleteItem(id) {
                if(confirm("确定永久删除这个美化档案？")) {
                    this.data = this.data.filter(d => d.id !== id); this.saveData(); this.showToast('已删除'); this.goHome();
                }
            },

            goDetail(id) {
                this.currentId = id;
                const item = this.data.find(d => d.id === id);
                if(!item) return;

                document.getElementById('d-title').innerText = item.title;
                document.getElementById('d-regex').innerText = item.regex || '无数据';
                document.getElementById('d-prompt').innerText = item.prompt || '无数据';
                
                if(item.testText && item.testText.trim() !== '') {
                    this.switchRenderMode('data');
                } else {
                    this.switchRenderMode('raw');
                }
                this.switchView('view-detail');
            },

            switchRenderMode(mode) {
                const item = this.data.find(d => d.id === this.currentId);
                if(!item) return;

                document.getElementById('sw-raw').classList.remove('active');
                document.getElementById('sw-data').classList.remove('active');
                document.getElementById('sw-' + mode).classList.add('active');

                const iframe = document.getElementById('d-iframe');
                let code = item.htmlCode || '<div style="text-align:center;padding:30px;color:#888;">暂无代码输入</div>';

                if (mode === 'data') {
                    if(item.testText) {
                        code = code.replace(/\$1/g, item.testText);
                    } else {
                        this.showToast('缺少测试文本，展示为空框架');
                    }
                }
                iframe.srcdoc = code;
            },

            async generateTestText() {
                if (!this.apiConfig.url || !this.apiConfig.key) {
                    alert("请先点击首页右上角的齿轮 ⚙ 配置 API 接口信息！");
                    return;
                }
                const promptVal = document.getElementById('f-prompt').value.trim();
                if (!promptVal) {
                    this.showToast("请先填入输出规范"); return;
                }

                this.showToast("AI 正在编写测试文本...");
                document.getElementById('f-testtext').value = "生成中，请稍候...";

                const systemMsg = "你是一个优秀的测试排版数据生成器。请根据用户提供的输出规范格式，虚构一段剧情并生成一份符合该格式的测试文本。要求：直接输出标签和内容，绝对不要输出任何其他解释性废话。";

                try {
                    let endpoint = this.apiConfig.url.replace(/\/$/, '') + '/chat/completions';
                    const res = await fetch(endpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + this.apiConfig.key },
                        body: JSON.stringify({
                            model: this.apiConfig.model || "gpt-3.5-turbo",
                            messages: [
                                { role: "system", content: systemMsg },
                                { role: "user", content: "输出规范如下：\n" + promptVal }
                            ],
                            temperature: 0.7
                        })
                    });
                    const resData = await res.json();
                    if (resData.choices && resData.choices[0] && resData.choices[0].message) {
                        document.getElementById('f-testtext').value = resData.choices[0].message.content.trim();
                        this.showToast("生成成功！");
                    } else { throw new Error("接口返回异常"); }
                } catch(e) {
                    document.getElementById('f-testtext').value = "";
                    alert("生成失败，请检查网络或 API 配置是否正确。\n报错信息：" + e.message);
                }
            },

            copyText(elementId, btnElement) {
                const text = document.getElementById(elementId).innerText;
                if(!text || text === '无数据') return;
                navigator.clipboard.writeText(text).then(() => {
                    const originalText = btnElement.innerText;
                    btnElement.classList.add('copied'); btnElement.innerText = '已复制';
                    setTimeout(() => { btnElement.classList.remove('copied'); btnElement.innerText = originalText; }, 1000);
                }).catch(err => { this.showToast('复制失败'); });
            },
            showToast(msg) {
                const t = document.getElementById('toast'); t.innerText = msg; t.classList.add('show');
                setTimeout(() => t.classList.remove('show'), 1500);
            }
        };
        app.init();
    </script>
</body>
</html>
