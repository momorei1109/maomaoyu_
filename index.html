<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://i.postimg.cc/9XxpsWyY/IMG-4419.png"> <!-- 应用桌面头像 -->
    <title>UI_ARCHIVE</title>
    
    <link href="https://fontsapi.zeoseven.com/2110/main/result.css" onload="this.rel='stylesheet'" rel="preload" as="style" crossorigin />
    <noscript><link rel="stylesheet" href="https://fontsapi.zeoseven.com/2110/main/result.css" /></noscript>
    
    <style>
        /* ====== 高定黑白灰引擎 ====== */
        :root {
            --bg-main: #F7F7F9;
            --bg-panel: #FFFFFF;
            --text-main: #111111;
            --text-sub: #888888;
            --border-line: rgba(0, 0, 0, 0.08);
            --btn-bg: #111111;
            --btn-text: #FFFFFF;
            --card-shadow: 0 8px 30px rgba(0, 0, 0, 0.04);
            --hover-bg: rgba(0, 0, 0, 0.03);
            --input-bg: #F0F0F2;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-main: #000000;
                --bg-panel: #151515;
                --text-main: #EFEFEF;
                --text-sub: #777777;
                --border-line: rgba(255, 255, 255, 0.1);
                --btn-bg: #EFEFEF;
                --btn-text: #111111;
                --card-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
                --hover-bg: rgba(255, 255, 255, 0.05);
                --input-bg: #1E1E1E;
            }
        }

        body.force-light { --bg-main: #F7F7F9; --bg-panel: #FFFFFF; --text-main: #111111; --text-sub: #888888; --border-line: rgba(0, 0, 0, 0.08); --btn-bg: #111111; --btn-text: #FFFFFF; --card-shadow: 0 8px 30px rgba(0, 0, 0, 0.04); --hover-bg: rgba(0, 0, 0, 0.03); --input-bg: #F0F0F2; }
        body.force-dark { --bg-main: #000000; --bg-panel: #151515; --text-main: #EFEFEF; --text-sub: #777777; --border-line: rgba(255, 255, 255, 0.1); --btn-bg: #EFEFEF; --btn-text: #111111; --card-shadow: 0 10px 40px rgba(0, 0, 0, 0.5); --hover-bg: rgba(255, 255, 255, 0.05); --input-bg: #1E1E1E; }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

        body {
            font-family: "ZevHeiTC-N Dev", -apple-system, sans-serif;
            background: var(--bg-main); color: var(--text-main);
            font-size: 12px; transition: background 0.3s, color 0.3s;
        }

        /* 顶部导航 */
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 20px; background: rgba(var(--bg-panel), 0.8);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-line);
            position: sticky; top: 0; z-index: 100;
        }
        .nav-title { font-size: 14px; font-weight: bold; letter-spacing: 1px; font-family: monospace; }
        .nav-tools { display: flex; gap: 14px; align-items: center; }
        .icon-btn { cursor: pointer; font-size: 16px; color: var(--text-sub); transition: color 0.2s; font-family: monospace; }
        .icon-btn:hover { color: var(--text-main); }

        /* 视图容器 */
        .view-container { display: none; padding: 20px; max-width: 600px; margin: 0 auto; animation: fadeIn 0.3s ease; }
        .view-container.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* ====== 主页：卡片网格 ====== */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 16px; }
        .card {
            background: var(--bg-panel); border: 1px solid var(--border-line);
            border-radius: 12px; overflow: hidden; cursor: pointer;
            box-shadow: var(--card-shadow); transition: transform 0.2s;
            display: flex; flex-direction: column;
        }
        .card:active { transform: scale(0.96); }
        .card-cover { width: 100%; aspect-ratio: 4/3; background-size: cover; background-position: center; border-bottom: 1px solid var(--border-line); background-color: var(--input-bg);}
        .card-info { padding: 10px 12px; flex-grow: 1;}
        .card-title { font-size: 12.5px; font-weight: bold; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .card-meta { font-size: 10px; color: var(--text-sub); font-family: monospace; }

        .empty-state { text-align: center; color: var(--text-sub); padding: 40px 20px; font-family: monospace; grid-column: 1 / -1; }

        /* ====== 编辑/新增页 ====== */
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 10.5px; font-weight: bold; color: var(--text-sub); margin-bottom: 6px; letter-spacing: 1px;}
        .form-input, .form-textarea {
            width: 100%; background: var(--input-bg); color: var(--text-main);
            border: 1px solid var(--border-line); border-radius: 8px;
            padding: 10px 12px; font-size: 12px; font-family: inherit; outline: none;
        }
        .form-textarea { height: 120px; resize: vertical; font-family: monospace; }
        
        .btn-row { display: flex; gap: 12px; margin-top: 24px; }
        .btn {
            flex: 1; padding: 12px; border-radius: 8px; font-size: 12px; font-weight: bold;
            text-align: center; cursor: pointer; border: none; font-family: monospace; letter-spacing: 1px;
        }
        .btn-primary { background: var(--btn-bg); color: var(--btn-text); }
        .btn-secondary { background: var(--input-bg); color: var(--text-main); border: 1px solid var(--border-line); }

        /* ====== 详情/渲染页 ====== */
        .detail-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .detail-title { font-size: 16px; font-weight: bold; }
        .detail-actions { display: flex; gap: 12px; }
        
        /* 手机壳沙箱 */
        .render-box {
            width: 100%; height: 600px;
            border: 8px solid var(--text-main); border-radius: 28px;
            overflow: hidden; margin-bottom: 24px; background: var(--bg-panel);
            position: relative; box-shadow: var(--card-shadow);
        }
        .render-box iframe { width: 100%; height: 100%; border: none; display: block; }
        
        /* 复制块 */
        .copy-block {
            background: var(--bg-panel); border: 1px solid var(--border-line);
            border-radius: 12px; padding: 14px; margin-bottom: 16px;
        }
        .cb-head { display: flex; justify-content: space-between; margin-bottom: 8px; align-items: center;}
        .cb-title { font-size: 11px; font-weight: bold; color: var(--text-sub); }
        .cb-btn { font-size: 10px; padding: 3px 8px; background: var(--hover-bg); border-radius: 4px; cursor: pointer; border: 1px solid var(--border-line); }
        .cb-content {
            font-family: monospace; font-size: 10px; color: var(--text-main);
            background: var(--input-bg); padding: 10px; border-radius: 6px;
            max-height: 100px; overflow-y: auto; white-space: pre-wrap; word-break: break-all;
        }

        /* 提示框 */
        .toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-20px);
            background: var(--text-main); color: var(--bg-main);
            padding: 8px 16px; border-radius: 20px; font-size: 11px; font-weight: bold;
            opacity: 0; pointer-events: none; transition: all 0.3s; z-index: 1000;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="nav-title" onclick="app.goHome()">✧ UI_ARCHIVE</div>
        <div class="nav-tools">
            <div class="icon-btn" onclick="app.toggleTheme()">☾</div>
            <div class="icon-btn" onclick="app.goEdit()">+</div>
        </div>
    </div>

    <!-- 视图 1：主页列表 -->
    <div id="view-home" class="view-container active">
        <div class="grid" id="card-list"></div>
    </div>

    <!-- 视图 2：详情渲染页 -->
    <div id="view-detail" class="view-container">
        <div class="detail-header">
            <div class="icon-btn" onclick="app.goHome()">← BACK</div>
            <div class="detail-actions">
                <div class="icon-btn" onclick="app.goEdit(app.currentId)">EDIT</div>
                <div class="icon-btn" onclick="app.deleteItem(app.currentId)" style="color: #ff4444;">DEL</div>
            </div>
        </div>
        <div class="detail-title" id="d-title" style="margin-bottom: 16px;">Title</div>
        
        <!-- 沙箱渲染区 -->
        <div class="render-box">
            <iframe id="d-iframe" sandbox="allow-scripts allow-same-origin"></iframe>
        </div>

        <div class="copy-block">
            <div class="cb-head">
                <span class="cb-title">REGEX / 正则表达式</span>
                <div class="cb-btn" onclick="app.copyText('d-regex')">COPY</div>
            </div>
            <div class="cb-content" id="d-regex"></div>
        </div>

        <div class="copy-block">
            <div class="cb-head">
                <span class="cb-title">PROMPT / 输出规范</span>
                <div class="cb-btn" onclick="app.copyText('d-prompt')">COPY</div>
            </div>
            <div class="cb-content" id="d-prompt"></div>
        </div>
    </div>

    <!-- 视图 3：新增/编辑表单 -->
    <div id="view-form" class="view-container">
        <div class="detail-header">
            <div class="icon-btn" onclick="app.goHome()">← CANCEL</div>
            <div class="detail-title" id="f-header-title">NEW UI</div>
        </div>
        
        <input type="hidden" id="f-id">
        
        <div class="form-group">
            <label class="form-label">TITLE / 名称</label>
            <input type="text" class="form-input" id="f-title" placeholder="例如：经久程星历状态栏">
        </div>
        <div class="form-group">
            <label class="form-label">COVER URL / 预览图链接</label>
            <input type="text" class="form-input" id="f-cover" placeholder="https://i.postimg.cc/...">
        </div>
        <div class="form-group">
            <label class="form-label">REGEX / 正则表达式</label>
            <input type="text" class="form-input" id="f-regex" placeholder="/<娱乐档案>([\s\S]*?)<\/娱乐档案>/is">
        </div>
        <div class="form-group">
            <label class="form-label">PROMPT / 输出规范</label>
            <textarea class="form-textarea" id="f-prompt" placeholder="填入该美化对应的系统提示词..."></textarea>
        </div>
        <div class="form-group">
            <label class="form-label">HTML CODE / 美化源码</label>
            <textarea class="form-textarea" id="f-html" placeholder="填入完整的 HTML 代码..." style="height: 250px;"></textarea>
        </div>

        <div class="btn-row">
            <button class="btn btn-primary" onclick="app.saveItem()">SAVE</button>
        </div>
    </div>

    <div class="toast" id="toast">Copied!</div>

    <script>
        const app = {
            data: [],
            currentId: null,

            init() {
                this.loadData();
                this.initTheme();
                this.renderList();
            },

            loadData() {
                const stored = localStorage.getItem('UI_Archive_Data');
                if (stored) {
                    try { this.data = JSON.parse(stored); } catch (e) { this.data = []; }
                } else {
                    // 默认预置一个示例卡片
                    this.data = [];
                }
            },

            saveData() {
                localStorage.setItem('UI_Archive_Data', JSON.stringify(this.data));
            },

            initTheme() {
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');
                const saved = localStorage.getItem('UI_Theme');
                if (saved === 'dark') document.body.classList.add('force-dark');
                else if (saved === 'light') document.body.classList.add('force-light');
                else if (prefersDark.matches) document.body.classList.add('force-dark');
            },

            toggleTheme() {
                let isDark = document.body.classList.contains('force-dark') || 
                             (!document.body.classList.contains('force-light') && window.matchMedia('(prefers-color-scheme: dark)').matches);
                if (isDark) {
                    document.body.classList.remove('force-dark');
                    document.body.classList.add('force-light');
                    localStorage.setItem('UI_Theme', 'light');
                } else {
                    document.body.classList.remove('force-light');
                    document.body.classList.add('force-dark');
                    localStorage.setItem('UI_Theme', 'dark');
                }
            },

            switchView(viewId) {
                document.querySelectorAll('.view-container').forEach(v => v.classList.remove('active'));
                document.getElementById(viewId).classList.add('active');
                window.scrollTo(0, 0);
            },

            goHome() {
                this.renderList();
                this.switchView('view-home');
            },

            renderList() {
                const list = document.getElementById('card-list');
                if (this.data.length === 0) {
                    list.innerHTML = `<div class="empty-state">NO DATA FOUND<br><br>点击右上角 + 号添加美化</div>`;
                    return;
                }
                list.innerHTML = this.data.map(item => `
                    <div class="card" onclick="app.goDetail('${item.id}')">
                        <div class="card-cover" style="background-image: url('${item.cover || ''}')"></div>
                        <div class="card-info">
                            <div class="card-title">${item.title || 'Untitled'}</div>
                            <div class="card-meta">HTML // JS // CSS</div>
                        </div>
                    </div>
                `).join('');
            },

            goEdit(id = null) {
                document.getElementById('f-id').value = id || '';
                if (id) {
                    document.getElementById('f-header-title').innerText = 'EDIT UI';
                    const item = this.data.find(d => d.id === id);
                    if(item) {
                        document.getElementById('f-title').value = item.title || '';
                        document.getElementById('f-cover').value = item.cover || '';
                        document.getElementById('f-regex').value = item.regex || '';
                        document.getElementById('f-prompt').value = item.prompt || '';
                        document.getElementById('f-html').value = item.htmlCode || '';
                    }
                } else {
                    document.getElementById('f-header-title').innerText = 'NEW UI';
                    document.getElementById('f-title').value = '';
                    document.getElementById('f-cover').value = '';
                    document.getElementById('f-regex').value = '';
                    document.getElementById('f-prompt').value = '';
                    document.getElementById('f-html').value = '';
                }
                this.switchView('view-form');
            },

            saveItem() {
                const idVal = document.getElementById('f-id').value;
                const newItem = {
                    id: idVal ? idVal : 'ui_' + Date.now(),
                    title: document.getElementById('f-title').value.trim(),
                    cover: document.getElementById('f-cover').value.trim(),
                    regex: document.getElementById('f-regex').value.trim(),
                    prompt: document.getElementById('f-prompt').value.trim(),
                    htmlCode: document.getElementById('f-html').value.trim()
                };
                
                if(!newItem.title) newItem.title = "Untitled UI";

                if (idVal) {
                    const idx = this.data.findIndex(d => d.id === idVal);
                    if (idx > -1) this.data[idx] = newItem;
                } else {
                    this.data.unshift(newItem);
                }
                this.saveData();
                this.showToast('SAVED');
                this.goHome();
            },

            deleteItem(id) {
                if(confirm("DELETE THIS UI?")) {
                    this.data = this.data.filter(d => d.id !== id);
                    this.saveData();
                    this.goHome();
                }
            },

            goDetail(id) {
                this.currentId = id;
                const item = this.data.find(d => d.id === id);
                if(!item) return;

                document.getElementById('d-title').innerText = item.title;
                document.getElementById('d-regex').innerText = item.regex || 'N/A';
                document.getElementById('d-prompt').innerText = item.prompt || 'N/A';
                
                // 将代码注入 Iframe
                const iframe = document.getElementById('d-iframe');
                iframe.srcdoc = item.htmlCode || '<div style="text-align:center;font-family:monospace;padding:20px;color:#888;">No Code</div>';
                
                this.switchView('view-detail');
            },

            copyText(elementId) {
                const text = document.getElementById(elementId).innerText;
                if(!text || text === 'N/A') return;
                navigator.clipboard.writeText(text).then(() => {
                    this.showToast('COPIED');
                }).catch(err => {
                    this.showToast('FAILED');
                });
            },

            showToast(msg) {
                const t = document.getElementById('toast');
                t.innerText = msg;
                t.classList.add('show');
                setTimeout(() => t.classList.remove('show'), 1500);
            }
        };

        app.init();
    </script>
</body>
</html>
