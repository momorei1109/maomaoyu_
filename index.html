<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="https://i.postimg.cc/02M9GT4s/IMG-4705.jpg">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#F7F7F9" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://i.postimg.cc/9XxpsWyY/IMG-4419.png">
    <title>Cinnamoroll</title>
    
    <!-- 极简 Zev黑体 -->
    <link href="https://fontsapi.zeoseven.com/2110/main/result.css" onload="this.rel='stylesheet'" rel="preload" as="style" crossorigin />
    <noscript><link rel="stylesheet" href="https://fontsapi.zeoseven.com/2110/main/result.css" /></noscript>
    
    <style>
        /* ====== 高定黑白灰引擎 (空气感) ====== */
        :root {
            --bg-main: #F7F7F9;
            --bg-panel: #FFFFFF;
            --text-main: #111111;
            --text-sub: #777777;
            --text-mini: #BBBBBB;
            
            --border-line: rgba(0, 0, 0, 0.08);
            --border-dash: rgba(0, 0, 0, 0.15);
            
            --card-shadow: 0 8px 30px rgba(0, 0, 0, 0.04), 0 1px 3px rgba(0, 0, 0, 0.02);
            --hover-bg: rgba(0, 0, 0, 0.03);
            --input-bg: #F0F0F2;
            
            --danger-color: #C2748B; 
        }

        body.dark-mode {
            --bg-main: #000000;
            --bg-panel: #151515;
            --text-main: #EFEFEF;
            --text-sub: #888888;
            --text-mini: #555555;
            
            --border-line: rgba(255, 255, 255, 0.08);
            --border-dash: rgba(255, 255, 255, 0.15);
            
            --card-shadow: 0 10px 40px rgba(0, 0, 0, 0.3), 0 1px 5px rgba(0, 0, 0, 0.15);
            --hover-bg: rgba(255, 255, 255, 0.05);
            --input-bg: #1E1E1E;
            
            --danger-color: #B56C81;
        }

        body.force-light { --bg-main:#F7F7F9; --bg-panel:#FFFFFF; --text-main:#111111; --text-sub:#777777; --text-mini:#BBBBBB; --border-line:rgba(0,0,0,0.08); --border-dash:rgba(0,0,0,0.15); --card-shadow:0 8px 30px rgba(0,0,0,0.04),0 1px 3px rgba(0,0,0,0.02); --hover-bg:rgba(0,0,0,0.03); --input-bg:#F0F0F2; --danger-color:#C2748B; }
        body.force-dark { --bg-main:#000000; --bg-panel:#151515; --text-main:#EFEFEF; --text-sub:#888888; --text-mini:#555555; --border-line:rgba(255,255,255,0.08); --border-dash:rgba(255,255,255,0.15); --card-shadow:0 10px 40px rgba(0,0,0,0.3),0 1px 5px rgba(0,0,0,0.15); --hover-bg:rgba(255,255,255,0.05); --input-bg:#1E1E1E; --danger-color:#B56C81; }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

        body {
            font-family: "ZevHeiTC-N Dev", -apple-system, sans-serif;
            background: var(--bg-main); color: var(--text-main);
            font-size: 12px; transition: background 0.3s, color 0.3s;
        }

        /* ====== 顶部导航 (带呼吸灯) ====== */
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 20px; background: rgba(var(--bg-panel), 0.85);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-line);
            position: sticky; top: 0; z-index: 100;
        }
        
        .nav-left { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        
        .status-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background-color: var(--text-main);
            box-shadow: 0 0 6px var(--text-sub);
            animation: breath 2.5s infinite ease-in-out;
        }
        @keyframes breath { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(0.8); } }

        .nav-title { font-size: 13.5px; font-weight: bold; letter-spacing: 0.5px; }
        
        .mode-btn { 
            cursor: pointer; font-size: 16px; color: var(--text-sub); 
            transition: color 0.2s; font-family: monospace; display: flex; align-items: center; justify-content: center;
            width: 32px; height: 32px; border-radius: 50%;
        }
        .mode-btn:hover { color: var(--text-main); background: var(--hover-bg); }

        /* ====== 视图容器 ====== */
        .view-container { 
            display: none; padding: 20px 16px; max-width: 440px; margin: 0 auto; 
            animation: fadeIn 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); 
        }
        .view-container.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* ====== 胶囊按钮系统 ====== */
        .capsule-btn {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 6px 14px; border-radius: 20px;
            font-size: 11px; font-weight: bold; letter-spacing: 1px;
            cursor: pointer; transition: all 0.2s ease;
            background: var(--bg-panel); border: 1px solid var(--border-line);
            color: var(--text-main);
        }
        .capsule-btn:active { transform: scale(0.95); }
        .capsule-btn.primary { background: var(--text-main); color: var(--bg-main); border-color: transparent; }
        .capsule-btn.danger { color: var(--danger-color); border-color: var(--border-line); }

        /* 点击变色反馈类 */
        .capsule-btn.copied {
            background: var(--text-main); color: var(--bg-main); border-color: transparent;
        }

        /* ====== 主页：添加板块 & 卡片网格 ====== */
        .add-block {
            background: var(--hover-bg); border: 1px dashed var(--border-dash);
            border-radius: 12px; padding: 14px; margin-bottom: 20px;
            display: flex; justify-content: center; align-items: center; gap: 8px;
            cursor: pointer; transition: all 0.2s ease;
        }
        .add-block:hover { border-color: var(--text-sub); }
        .add-block:active { transform: scale(0.98); background: var(--border-line); }
        
        /* 变浅且不加粗 */
        .add-text { font-size: 11.5px; font-weight: normal; color: var(--text-mini); letter-spacing: 1px; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 16px; }
        .card {
            background: var(--bg-panel); border: 1px solid var(--border-line);
            border-radius: 12px; overflow: hidden; cursor: pointer;
            box-shadow: var(--card-shadow); transition: transform 0.2s;
            display: flex; flex-direction: column;
        }
        .card:active { transform: scale(0.96); }
        .card-cover { width: 100%; aspect-ratio: 4/3; background-size: cover; background-position: center; border-bottom: 1px solid var(--border-line); background-color: var(--input-bg);}
        .card-info { padding: 10px 12px; flex-grow: 1; display: flex; flex-direction: column; justify-content: center;}
        .card-title { font-size: 12.5px; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .empty-state { text-align: center; color: var(--text-mini); padding: 30px 0; font-weight: bold; grid-column: 1 / -1; }

        /* ====== 编辑/新增页 ====== */
        .form-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .form-title { font-size: 15px; font-weight: bold; }
        
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 10.5px; font-weight: bold; color: var(--text-sub); margin-bottom: 6px; letter-spacing: 0.5px;}
        .form-input, .form-textarea {
            width: 100%; background: var(--input-bg); color: var(--text-main);
            border: 1px solid var(--border-line); border-radius: 10px;
            padding: 10px 12px; font-size: 11.5px; font-family: inherit; outline: none;
            transition: border-color 0.2s;
        }
        .form-input:focus, .form-textarea:focus { border-color: var(--text-sub); }
        .form-textarea { height: 100px; resize: vertical; line-height: 1.5; }
        .code-area { font-family: monospace; height: 180px; }

        /* 手机直传图片虚线框 */
        .upload-area {
            width: 100%; height: 120px;
            background: var(--input-bg); border: 1px dashed var(--border-dash);
            border-radius: 10px; display: flex; justify-content: center; align-items: center;
            cursor: pointer; overflow: hidden; position: relative; transition: border-color 0.2s;
        }
        .upload-area:hover { border-color: var(--text-sub); }
        .upload-text { font-size: 11px; color: var(--text-mini); pointer-events: none; }
        .upload-preview { width: 100%; height: 100%; object-fit: cover; display: none; pointer-events: none; }

        /* ====== 详情/预览页 ====== */
        .detail-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .detail-actions { display: flex; gap: 8px; }
        
        .d-title { font-size: 15px; font-weight: bold; margin-bottom: 16px; line-height: 1.4; word-break: break-all;}
        
        /* 无边框空气感渲染区 */
        .render-box {
            width: 100%; height: 600px;
            border: 1px solid var(--border-line); border-radius: 16px;
            overflow: hidden; margin-bottom: 24px; background: var(--bg-panel);
            box-shadow: var(--card-shadow);
        }
        .render-box iframe { width: 100%; height: 100%; border: none; display: block; }
        
        /* 复制块 */
        .copy-block {
            background: var(--bg-panel); border: 1px solid var(--border-line);
            border-radius: 12px; padding: 14px; margin-bottom: 16px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
        }
        .cb-head { display: flex; justify-content: space-between; margin-bottom: 10px; align-items: center;}
        .cb-title { font-size: 11px; font-weight: bold; color: var(--text-main); }
        .cb-content {
            font-family: monospace; font-size: 10.5px; color: var(--text-sub);
            background: var(--input-bg); padding: 10px 12px; border-radius: 8px;
            max-height: 120px; overflow-y: auto; white-space: pre-wrap; word-break: break-all;
            border: 1px solid var(--border-line); line-height: 1.4;
        }

        /* 提示框 */
        .toast {
            position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-10px);
            background: var(--text-main); color: var(--bg-main);
            padding: 8px 18px; border-radius: 20px; font-size: 11px; font-weight: bold; letter-spacing: 1px;
            opacity: 0; pointer-events: none; transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="nav-left" onclick="app.goHome()">
            <div class="status-dot"></div>
            <div class="nav-title">Cinnamoroll (-ω-)</div>
        </div>
        <div class="mode-btn" onclick="app.toggleTheme()">☾</div>
    </div>

    <!-- 视图 1：主页列表 -->
    <div id="view-home" class="view-container active">
        <!-- 秀气版新增卡片 -->
        <div class="add-block" onclick="app.goEdit()">
            <span class="add-text">+ 新增小卡片</span>
        </div>
        
        <div class="grid" id="card-list"></div>
    </div>

    <!-- 视图 2：详情预览页 -->
    <div id="view-detail" class="view-container">
        <div class="detail-header">
            <div class="capsule-btn" onclick="app.goHome()">返回</div>
            <div class="detail-actions">
                <div class="capsule-btn danger" onclick="app.deleteItem(app.currentId)">删除</div>
                <div class="capsule-btn primary" onclick="app.goEdit(app.currentId)">编辑</div>
            </div>
        </div>
        
        <div class="d-title" id="d-title">标题加载中...</div>
        
        <div class="render-box">
            <iframe id="d-iframe" sandbox="allow-scripts allow-same-origin"></iframe>
        </div>

        <div class="copy-block">
            <div class="cb-head">
                <span class="cb-title">正则匹配词</span>
                <div class="capsule-btn" onclick="app.copyText('d-regex', this)">复制正则</div>
            </div>
            <div class="cb-content" id="d-regex"></div>
        </div>

        <div class="copy-block">
            <div class="cb-head">
                <span class="cb-title">酒馆输出规范</span>
                <div class="capsule-btn" onclick="app.copyText('d-prompt', this)">复制规范</div>
            </div>
            <div class="cb-content" id="d-prompt"></div>
        </div>
    </div>

    <!-- 视图 3：新增/编辑表单 -->
    <div id="view-form" class="view-container">
        <div class="form-header">
            <div class="capsule-btn" onclick="app.goHome()">取消</div>
            <div class="form-title" id="f-header-title">编辑属性</div>
            <div class="capsule-btn primary" onclick="app.saveItem()">保存</div>
        </div>
        
        <input type="hidden" id="f-id">
        
        <div class="form-group">
            <label class="form-label">标题名称</label>
            <input type="text" class="form-input" id="f-title" placeholder="如：极简聊天状态栏">
        </div>

        <!-- 手机直传图片模块 -->
        <div class="form-group">
            <label class="form-label">封面图片 (点击方框上传相册图片)</label>
            <div class="upload-area" onclick="document.getElementById('f-cover-file').click()">
                <span class="upload-text" id="upload-text">点击选择照片</span>
                <img class="upload-preview" id="f-cover-preview" src="">
            </div>
            <!-- 隐藏的 input file 和 base64 容器 -->
            <input type="file" id="f-cover-file" accept="image/*" style="display:none;" onchange="app.handleImageUpload(event)">
            <input type="hidden" id="f-cover-base64">
        </div>

        <div class="form-group">
            <label class="form-label">正则表达式</label>
            <input type="text" class="form-input" id="f-regex" placeholder="/<自定义标签>([\s\S]*?)<\/自定义标签>/is">
        </div>
        <div class="form-group">
            <label class="form-label">酒馆输出规范 (Prompt)</label>
            <textarea class="form-textarea" id="f-prompt" placeholder="填入该美化对应的系统提示词..."></textarea>
        </div>
        <div class="form-group">
            <label class="form-label">HTML 源码代码</label>
            <textarea class="form-textarea code-area" id="f-html" placeholder="填入完整的 HTML 代码..."></textarea>
        </div>
    </div>

    <div class="toast" id="toast">操作成功</div>

    <script>
        const app = {
            data: [],
            currentId: null,

            init() {
                this.loadData();
                this.initTheme();
                this.renderList();
            },

            loadData() {
                const stored = localStorage.getItem('UI_Archive_Data');
                if (stored) {
                    try { this.data = JSON.parse(stored); } catch (e) { this.data = []; }
                } else {
                    this.data = [];
                }
            },

            saveData() {
                localStorage.setItem('UI_Archive_Data', JSON.stringify(this.data));
            },

            initTheme() {
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');
                const saved = localStorage.getItem('UI_Theme');
                const modeBtn = document.querySelector('.mode-btn');
                
                if (saved === 'dark') {
                    document.body.classList.add('force-dark'); modeBtn.innerText = '☼';
                } else if (saved === 'light') {
                    document.body.classList.add('force-light'); modeBtn.innerText = '☾';
                } else if (prefersDark.matches) {
                    document.body.classList.add('force-dark'); modeBtn.innerText = '☼';
                }
            },

            toggleTheme() {
                let isDark = document.body.classList.contains('force-dark') || 
                             (!document.body.classList.contains('force-light') && window.matchMedia('(prefers-color-scheme: dark)').matches);
                const modeBtn = document.querySelector('.mode-btn');
                             
                if (isDark) {
                    document.body.classList.remove('force-dark');
                    document.body.classList.add('force-light');
                    localStorage.setItem('UI_Theme', 'light');
                    modeBtn.innerText = '☾';
                } else {
                    document.body.classList.remove('force-light');
                    document.body.classList.add('force-dark');
                    localStorage.setItem('UI_Theme', 'dark');
                    modeBtn.innerText = '☼';
                }
            },

            switchView(viewId) {
                document.querySelectorAll('.view-container').forEach(v => v.classList.remove('active'));
                document.getElementById(viewId).classList.add('active');
                window.scrollTo(0, 0);
            },

            goHome() {
                this.renderList();
                this.switchView('view-home');
            },

            renderList() {
                const list = document.getElementById('card-list');
                if (this.data.length === 0) {
                    list.innerHTML = `<div class="empty-state">收纳夹空空如也</div>`;
                    return;
                }
                list.innerHTML = this.data.map(item => `
                    <div class="card" onclick="app.goDetail('${item.id}')">
                        <div class="card-cover" style="background-image: url('${item.cover || ''}')"></div>
                        <div class="card-info">
                            <div class="card-title">${item.title || '未命名收纳'}</div>
                        </div>
                    </div>
                `).join('');
            },

            /* 图片上传并智能压缩 Base64 */
            handleImageUpload(event) {
                const file = event.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 400; // 限制宽度防止爆内存
                        let width = img.width;
                        let height = img.height;
                        
                        if (width > MAX_WIDTH) {
                            height = Math.round((height * MAX_WIDTH) / width);
                            width = MAX_WIDTH;
                        }
                        
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        // 压缩为 jpeg，质量 0.6
                        const dataUrl = canvas.toDataURL('image/jpeg', 0.6); 
                        
                        document.getElementById('f-cover-base64').value = dataUrl;
                        
                        const preview = document.getElementById('f-cover-preview');
                        preview.src = dataUrl;
                        preview.style.display = 'block';
                        document.getElementById('upload-text').style.display = 'none';
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            },

            goEdit(id = null) {
                document.getElementById('f-id').value = id || '';
                
                const preview = document.getElementById('f-cover-preview');
                const uploadText = document.getElementById('upload-text');
                
                if (id) {
                    document.getElementById('f-header-title').innerText = '修改设定';
                    const item = this.data.find(d => d.id === id);
                    if(item) {
                        document.getElementById('f-title').value = item.title || '';
                        document.getElementById('f-cover-base64').value = item.cover || '';
                        document.getElementById('f-regex').value = item.regex || '';
                        document.getElementById('f-prompt').value = item.prompt || '';
                        document.getElementById('f-html').value = item.htmlCode || '';
                        
                        if(item.cover) {
                            preview.src = item.cover;
                            preview.style.display = 'block';
                            uploadText.style.display = 'none';
                        } else {
                            preview.style.display = 'none';
                            uploadText.style.display = 'block';
                        }
                    }
                } else {
                    document.getElementById('f-header-title').innerText = '录入新美化';
                    document.getElementById('f-title').value = '';
                    document.getElementById('f-cover-base64').value = '';
                    document.getElementById('f-regex').value = '';
                    document.getElementById('f-prompt').value = '';
                    document.getElementById('f-html').value = '';
                    
                    preview.style.display = 'none';
                    preview.src = '';
                    uploadText.style.display = 'block';
                    document.getElementById('f-cover-file').value = ''; // 清空选择的文件
                }
                this.switchView('view-form');
            },

            saveItem() {
                const idVal = document.getElementById('f-id').value;
                const newItem = {
                    id: idVal ? idVal : 'ui_' + Date.now(),
                    title: document.getElementById('f-title').value.trim(),
                    cover: document.getElementById('f-cover-base64').value.trim(),
                    regex: document.getElementById('f-regex').value.trim(),
                    prompt: document.getElementById('f-prompt').value.trim(),
                    htmlCode: document.getElementById('f-html').value.trim()
                };
                
                if(!newItem.title) newItem.title = "未命名收纳";

                if (idVal) {
                    const idx = this.data.findIndex(d => d.id === idVal);
                    if (idx > -1) this.data[idx] = newItem;
                } else {
                    this.data.unshift(newItem);
                }
                
                try {
                    this.saveData();
                    this.showToast('保存成功');
                    this.goHome();
                } catch(e) {
                    alert("保存失败！可能是图片过大超出了手机存储限制，请尝试上传更小尺寸的图片。");
                }
            },

            deleteItem(id) {
                if(confirm("确定要永久删除这个美化档案吗？")) {
                    this.data = this.data.filter(d => d.id !== id);
                    this.saveData();
                    this.showToast('已删除');
                    this.goHome();
                }
            },

            goDetail(id) {
                this.currentId = id;
                const item = this.data.find(d => d.id === id);
                if(!item) return;

                document.getElementById('d-title').innerText = item.title;
                document.getElementById('d-regex').innerText = item.regex || '无数据';
                document.getElementById('d-prompt').innerText = item.prompt || '无数据';
                
                const iframe = document.getElementById('d-iframe');
                iframe.srcdoc = item.htmlCode || '<div style="text-align:center;font-family:monospace;padding:30px;color:#888;">暂无代码输入</div>';
                
                this.switchView('view-detail');
            },

            /* 带有视觉反馈的复制功能 */
            copyText(elementId, btnElement) {
                const text = document.getElementById(elementId).innerText;
                if(!text || text === '无数据') return;
                
                navigator.clipboard.writeText(text).then(() => {
                    // 按钮反色动画
                    const originalText = btnElement.innerText;
                    btnElement.classList.add('copied');
                    btnElement.innerText = '已复制 ✓';
                    
                    setTimeout(() => {
                        btnElement.classList.remove('copied');
                        btnElement.innerText = originalText;
                    }, 1000);
                    
                }).catch(err => {
                    this.showToast('复制失败，请手动选择');
                });
            },

            showToast(msg) {
                const t = document.getElementById('toast');
                t.innerText = msg;
                t.classList.add('show');
                setTimeout(() => t.classList.remove('show'), 1500);
            }
        };

        app.init();
    </script>
</body>
</html>
